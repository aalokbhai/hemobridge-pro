# App + MySQL ek saath:   docker compose up -d --build
# .env me DB_PASSWORD, DB_ROOT_PASSWORD, ADMIN_EMAIL, ADMIN_PASSWORD zaroor bharo.
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-hemobridge}
      MYSQL_USER: ${DB_USER:-hemo}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD .env me set karo}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD .env me set karo}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"   # Nginx/Caddy ke peeche ho to "127.0.0.1:3000:3000" kar do

volumes:
  db_data:
